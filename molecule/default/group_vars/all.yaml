---
service_name: gaiad
download_root: "/tmp/molecule"
local_bin_path: "/usr/local/bin"
service_home: "/usr/local/{{ service_name }}"
check_flag: "{{ download_root }}/to-notify-verifier-that-converged-in-check-mode"
call_mode: "{{ lookup('ansible.builtin.env', 'ANSIBLE_CALL_MODE', default='split') }}"
run_traps: "{{ lookup('ansible.builtin.env', 'ANSIBLE_RUN_TRAPS',
  default='false') | bool }}"
meva_packages:
  - name:
      - git
      - vim
      - lsof
      - nginx
      - rsync
    state: present
    update_cache: true
    install_recommends: false
meva_groups2create:
  - name: "{{ service_name }}"
meva_users2create:
  - name: "{{ service_name }}"
    group: "{{ service_name }}"
    create_home: false
    home: "{{ service_home }}"
    shell: "/usr/sbin/nologin"
    password_expire_warn: 3
meva_key2user:
  - user: "{{ service_name }}"
    key: "ssh-ed25519
      AAAAC3NzaC1lZDI1NTE5AAAAIGvDthv4Z9eqO2yljFz9rrZ8zibYPyNHrTKkbSR3FuuJ test"
meva_dirs2create:
  - path: "{{ local_bin_path }}"
    owner: "root"
    group: "root"
    mode: "0755"
  - path: "{{ service_home | dirname }}"
    owner: "root"
    group: "root"
    mode: "0755"
  - path: "{{ service_home }}/.ssh"
    owner: "{{ service_name }}"
    group: "{{ service_name }}"
    mode: "0700"
meva_templates2upload:
  - src: "templates/service-restricted.j2"
    dest: "/etc/systemd/system/{{ service_name }}.service"
    mode: "0440"
    force: "yes"
    vars:
      unit:
        Description: "Node {{ service_name }} service"
      service:
        Restart: ""
        User: "{{ service_name }}"
        Group: "{{ service_name }}"
        ReadWritePaths: "{{ service_home }}"
        WorkingDirectory: "{{ service_home }}"
        SyslogIdentifier: "{{ service_name }}"
        EnvironmentFile: "-/etc/default/{{ service_name }}"
meva_systemd4units: # DevSkim: ignore DS126858
  - name: "{{ service_name }}"
meva_files2upload:
  - src: "README.md"
    dest: "{{ service_home }}"
    mode: "0644"
    force: false
  - src: ".lycheeignore"
    dest: "{{ service_home }}/lycheeignore"
    mode: "0644"
    force: false
meva_tree2rsync:
  - src: "tests"
    dest: "{{ service_home }}/rsync"
meva_file2down:
  - url: "https://github.com/cosmos/gaia/releases/\
      download/v14.2.0/gaiad-v14.2.0-linux-amd64"
    dest: "{{ local_bin_path }}"
    creates: "{{ service_name }}"
meva_cmd2run: # DevSkim: ignore DS126858
  - argv:
      - /usr/bin/env
      - ls
    changed_when: false
meva_run4shell:
  - cmd: /usr/bin/env ls
    changed_when: false
# fails when conditionals are moved out of jinja or completely into it
meva_traps:
  - when: none == meva_trap_undefined
    failed_when: true
  - failed_when: none == meva_trap_undefined
    changed_when: none == meva_trap_undefined
    notify: Trap broken changed_when
  - failed_when: _task_result.attempts < 2
    changed_when: false
    until: _task_result.attempts > 1 or none == meva_trap_undefined
    retries: 1
    delay: 0
meva_trap_args:
  _apt.yaml: { name: meva-trap-absent, state: absent }
  _group.yaml: { name: meva-trap-absent, state: absent }
  _user.yaml: { name: meva-trap-absent, state: absent }
  _file.yaml: { path: /nonexistent/meva-trap-absent, state: absent }
  _template.yaml: { src: /nonexistent/meva-trap.j2, dest: /nonexistent/meva-trap }
  _copy.yaml: { src: /nonexistent/meva-trap, dest: /nonexistent/meva-trap }
  _rsync.yaml: { src: /nonexistent/meva-trap, dest: /nonexistent/meva-trap }
  _systemd.yaml: { name: meva-trap-absent.service, state: stopped }
  _key.yaml: { user: meva-trap-absent, key: ssh-ed25519 AAAA meva-trap, state: absent }
  _parted.yaml: { device: /dev/meva-trap-absent, state: info }
  _lvg.yaml: { vg: meva-trap-absent, state: absent }
  _lvol.yaml: { vg: meva-trap-absent, lv: meva-trap-absent, state: absent }
  _filesystem.yaml: { dev: /dev/meva-trap-absent, state: absent }
  _mount.yaml: { path: /nonexistent/meva-trap-absent, state: unmounted }
  _command.yaml: { argv: [/usr/bin/env, "true"] }
  _shell.yaml: { cmd: /usr/bin/env true }
