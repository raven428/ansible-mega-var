---
dependency:
  name: galaxy
  enabled: true
  options:
    force: true
driver:
  # see molecule_docker/playbooks for example
  name: podman
platforms:
  - name: "dkr4ans"
    image: "ghcr.io/megalomania428/systemd-debian12:latest"
    pre_build_image: true
    override_command: false
provisioner:
  name: ansible
  log: true
  env:
    ANSIBLE_VERBOSITY: 1
  inventory:
    links:
      group_vars: "group_vars"
  playbooks:
    prepare: prepare.yaml
    converge: converge.yaml
    verify: verify.yaml
  config_options:
    defaults:
      remote_tmp: /tmp
      jinja2_extensions: jinja2.ext.do
verifier:
  name: ansible
scenario:
  name: default
  create_sequence:
    - dependency
    - create
    - prepare
  converge_sequence:
    - converge
