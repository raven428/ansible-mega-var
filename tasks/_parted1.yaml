---
- name: Partitioning some disks
  community.general.parted:
    align: "{{ i.align | default(omit) }}"
    device: "{{ i.device }}"
    flags: "{{ i.flags | default(omit) }}"
    fs_type: "{{ i.fs_type | default(omit) }}"
    label: "{{ i.label | default('gpt') }}"
    name: "{{ i.name | default(omit) }}"
    number: "{{ i.number | default(omit) }}"
    part_end: "{{ i.part_end | default(omit) }}"
    part_start: "{{ i.part_start | default(omit) }}"
    part_type: "{{ i.part_type | default(omit) }}"
    resize: "{{ i.resize | default('no') }}"
    state: "{{ i.state | default('present') }}"
    unit: "{{ i.unit | default(omit) }}"
  register: _task_result
  when: "{{ i.when | default(_meva_cond_true) }}" # noqa no-jinja-when
  tags: "{{ i.tags | default(omit) }}"
  diff: "{{ i.diff | default(omit) }}"
  notify: "{{ i.notify | default(omit) }}"
  timeout: "{{ i.timeout | default(omit) }}"
  check_mode: "{{ i.check_mode | default(omit) }}"
  failed_when: "{{ i.failed_when | default(_meva_cond_failed) }}"
  changed_when: "{{ i.changed_when | default(_meva_cond_changed) }}"
  ignore_errors: "{{ i.ignore_errors | default(false) }}"
  become: "{{ i.become | default(omit) }}"
  become_exe: "{{ i.become_exe | default(omit) }}"
  become_user: "{{ i.become_user | default(omit) }}"
  become_flags: "{{ i.become_flags | default(omit) }}"
  retries: "{{ i.retries | default(3 if 'until' in i else 0) }}"
  delay: "{{ i.delay | default(omit) }}"
  until: "{{ i.until | default(_meva_cond_success) }}"
  async: "{{ i.async | default(omit) }}"
  poll: "{{ i.poll | default(omit) }}"
  no_log: "{{ i.no_log | default(omit) }}"
